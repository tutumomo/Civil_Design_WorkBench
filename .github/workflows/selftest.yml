name: selftest

# 純計算類自測：不需要 OpenCADStudio、OCSS、Blender 或任何 GUI 工具。
# 全案回歸（tools/selftest/regression.py）需要本機 CAD 後端與既有 out/ 產物，不在此跑，
# 交付前仍須在本機執行（AGENTS.md §3）。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Unified selftest entry
        run: python tools/selftest/run_all.py --no-cad

      - name: Calculator launch check (all)
        # design_launch_check --all 已含在 run_all；此步獨立保留，讓失敗訊息在 CI 上更明顯。
        continue-on-error: true
        run: python tools/selftest/design_launch_check.py --all
